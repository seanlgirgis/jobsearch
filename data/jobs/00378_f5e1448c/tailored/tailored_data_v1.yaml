- Keep metrics/logs/traces language, but anchor examples in APM and telemetry investigation outcomes.
- Use verbs like supported, analyzed, built dashboards, tuned thresholds, investigated, correlated, remediated.
- Avoid verbs like architected platform, owned Kubernetes observability stack, built GPU telemetry platform unless strictly proven.

interview_answer_guardrail: >
